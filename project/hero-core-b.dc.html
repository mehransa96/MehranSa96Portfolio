<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://unpkg.com/three@0.149.0/build/three.min.js"></script>
<style>
  body{margin:0;background:#08090A;--accent:#00E28A;}
  a{color:#E7E9E8;text-decoration:none;transition:color .2s}
  a:hover{color:var(--accent)}
  @keyframes msIn{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
  @keyframes msChar{from{opacity:0;transform:translateY(.42em);filter:blur(9px)}to{opacity:1;transform:none;filter:blur(0)}}
  @keyframes msPulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.32;transform:scale(1.85)}}
  @keyframes msCue{0%{transform:translateY(0);opacity:.25}50%{transform:translateY(7px);opacity:1}100%{transform:translateY(0);opacity:.25}}
</style>
</helmet>
<div dir="rtl" lang="fa" style="background:#08090A;color:#E7E9E8;font-family:'Vazirmatn',sans-serif;min-height:100vh;overflow:hidden;position:relative;">
  <div style="position:absolute;inset:0;pointer-events:none;background-image:linear-gradient(rgba(0,226,138,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(0,226,138,.045) 1px,transparent 1px);background-size:clamp(38px,4.4vw,66px) clamp(38px,4.4vw,66px);mask-image:radial-gradient(125% 95% at 50% 20%,#000 8%,rgba(0,0,0,.3) 52%,transparent 82%);-webkit-mask-image:radial-gradient(125% 95% at 50% 20%,#000 8%,rgba(0,0,0,.3) 52%,transparent 82%);"></div>
  <div style="position:absolute;inset:0;pointer-events:none;background:radial-gradient(110% 85% at 22% 4%,rgba(0,226,138,.05),transparent 62%);"></div>

  <div style="position:relative;border-bottom:1px solid #151818;background:rgba(8,9,10,.7);backdrop-filter:blur(18px);">
    <div style="max-width:1360px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:20px;padding:14px clamp(18px,4vw,48px);">
      <div style="display:flex;align-items:center;gap:12px;">
        <img src="assets/logo.png" alt="GMTec" style="height:26px;width:auto;display:block;object-fit:contain;">
        <span style="font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:3px;color:#6E7A78;">GMTEC</span>
      </div>
      <div style="display:flex;align-items:center;gap:22px;font-size:13.5px;color:#8A9391;">
        <a href="#" style="white-space:nowrap;">تخصص‌ها</a>
        <a href="#" style="white-space:nowrap;">پروژه‌ها</a>
        <a href="#" style="white-space:nowrap;">استک</a>
      </div>
      <div style="display:flex;align-items:center;gap:14px;">
        <span style="font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:1.5px;color:#6E7A78;">EN</span>
        <span style="border:1px solid #2A2F2E;border-radius:2px;padding:8px 18px;font-size:13px;color:#C8D0CE;white-space:nowrap;">پیام در تلگرام</span>
      </div>
    </div>
  </div>

  <div style="position:relative;max-width:1360px;margin:0 auto;padding:clamp(48px,7vw,92px) clamp(18px,4vw,48px) 0;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:clamp(36px,5vw,64px);align-items:center;">
    <div>
      <div style="display:flex;align-items:center;gap:10px;font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:2px;color:#6E7A78;margin-bottom:34px;animation:msIn .8s cubic-bezier(.16,.86,.2,1) both;">
        <span style="width:5px;height:5px;border-radius:50%;background:var(--accent);animation:msPulse 2.6s ease-in-out infinite;"></span>
        <span>CEH CERTIFIED · SENIOR SOFTWARE ENGINEER</span>
      </div>
      <h1 dir="ltr" style="margin:0;font-family:'Space Grotesk',sans-serif;font-size:clamp(38px,6.4vw,82px);font-weight:500;line-height:1.04;letter-spacing:-0.03em;animation:msChar .9s cubic-bezier(.16,.86,.2,1) .25s both;">Mehran Sabzali</h1>
      <div style="margin-top:22px;font-size:clamp(17px,1.5vw,21px);font-weight:500;color:#C8D0CE;animation:msIn .9s cubic-bezier(.16,.86,.2,1) .8s both;">مهران سبزعلی — مهندس ارشد نرم‌افزار</div>
      <div dir="ltr" style="display:flex;flex-wrap:wrap;gap:12px 18px;margin-top:clamp(38px,5vw,58px);font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:1.5px;color:#5C6664;animation:msIn .9s cubic-bezier(.16,.86,.2,1) 1s both;">
        <span>TEHRAN, IR</span><span style="color:#232726;">|</span><span>AI · SECURITY · IOT</span><span style="color:#232726;">|</span><span>8 YEARS</span><span style="color:#232726;">|</span><span>23 PROJECTS</span>
      </div>
      <div style="display:flex;align-items:center;gap:10px;margin-top:clamp(34px,4vw,46px);font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:2px;color:#3E4644;animation:msIn .9s cubic-bezier(.16,.86,.2,1) 1.2s both;">
        <span style="display:inline-block;animation:msCue 2.2s ease-in-out infinite;">↓</span><span>SCROLL</span>
      </div>
    </div>
    <div style="position:relative;animation:msIn 1s cubic-bezier(.16,.86,.2,1) .45s both;">
      <div ref="{{ wrapRef }}" style="position:relative;width:100%;max-width:520px;margin:0 auto;aspect-ratio:1;">
        <canvas ref="{{ canvasRef }}" style="position:absolute;inset:0;width:100%;height:100%;display:block;cursor:grab;"></canvas>
      </div>
      <div dir="ltr" style="max-width:520px;margin:14px auto 0;display:flex;justify-content:space-between;font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:1.5px;color:#3E4644;">
        <span>FRACTURED SHELL CORE</span><span>DRAG TO ORBIT</span>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  constructor(p){ super(p); this.canvasRef = React.createRef(); this.wrapRef = React.createRef(); }
  componentDidMount(){ this.boot(); }
  componentWillUnmount(){
    clearTimeout(this._t); cancelAnimationFrame(this.raf);
    if (this.ro) this.ro.disconnect();
    if (this._cleanup) this._cleanup();
    if (this.renderer) this.renderer.dispose();
  }
  boot(){
    const THREE = window.THREE;
    const cv = this.canvasRef.current, wrap = this.wrapRef.current;
    if (!THREE || !cv || !wrap) { this._t = setTimeout(() => this.boot(), 70); return; }

    const A = 0x00E28A;
    const renderer = new THREE.WebGLRenderer({ canvas: cv, alpha: true, antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    this.renderer = renderer;
    const scene = new THREE.Scene();
    const cam = new THREE.PerspectiveCamera(40, 1, 0.1, 100);
    cam.position.set(0, 0, 5.1);
    const root = new THREE.Group();
    scene.add(root);

    const line = (geo, color, op, w) => new THREE.LineSegments(
      new THREE.WireframeGeometry(geo),
      new THREE.LineBasicMaterial({ color: color, transparent: true, opacity: op, linewidth: w || 1 })
    );

    const src = new THREE.IcosahedronGeometry(1.5, 0);
    const sp = src.attributes.position.array;
    const shards = [];
    for (let i = 0; i < sp.length; i += 9) {
      const v = [];
      for (let k = 0; k < 3; k++) v.push(new THREE.Vector3(sp[i + k * 3], sp[i + k * 3 + 1], sp[i + k * 3 + 2]));
      const c = new THREE.Vector3().add(v[0]).add(v[1]).add(v[2]).multiplyScalar(1 / 3);
      shards.push({ v: v, c: c, n: c.clone().normalize(), ph: Math.random() * Math.PI * 2 });
    }
    const segCount = shards.length * 3;
    const pos = new Float32Array(segCount * 6);
    const sgeo = new THREE.BufferGeometry();
    sgeo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    const shell = new THREE.LineSegments(sgeo, new THREE.LineBasicMaterial({ color: A, transparent: true, opacity: 0.62 }));
    root.add(shell);
    const writeShards = t => {
      let o = 0;
      for (let s = 0; s < shards.length; s++) {
        const sh = shards[s];
        const push = 0.12 + Math.sin(t / 96 + sh.ph) * 0.16;
        const k = 0.9 + Math.sin(t / 96 + sh.ph) * 0.05;
        const p = sh.v.map(v => v.clone().sub(sh.c).multiplyScalar(k).add(sh.c).addScaledVector(sh.n, push));
        for (let e = 0; e < 3; e++) {
          const a1 = p[e], b1 = p[(e + 1) % 3];
          pos[o++] = a1.x; pos[o++] = a1.y; pos[o++] = a1.z;
          pos[o++] = b1.x; pos[o++] = b1.y; pos[o++] = b1.z;
        }
      }
      sgeo.attributes.position.needsUpdate = true;
    };
    writeShards(0);

    const inner = line(new THREE.IcosahedronGeometry(0.85, 1), A, 0.22);
    root.add(inner);
    const cage = line(new THREE.IcosahedronGeometry(2.05, 0), 0xE7E9E8, 0.07);
    root.add(cage);
    const shells = [inner, cage];
    inner.userData.sp = [0.0015, -0.0021, 0.0006];
    cage.userData.sp = [-0.0006, 0.0009, 0.0004];

    const pts = new THREE.Points(new THREE.IcosahedronGeometry(1.5, 0), new THREE.PointsMaterial({ color: 0xE7E9E8, size: 0.032, transparent: true, opacity: 0.6, sizeAttenuation: true }));
    root.add(pts);
    this._writeShards = writeShards;

    const nucleus = new THREE.Mesh(
      new THREE.IcosahedronGeometry(0.22, 1),
      new THREE.MeshBasicMaterial({ color: A, transparent: true, opacity: 0.85 })
    );
    root.add(nucleus);
    const halo = new THREE.Mesh(
      new THREE.SphereGeometry(0.44, 24, 24),
      new THREE.MeshBasicMaterial({ color: A, transparent: true, opacity: 0.07 })
    );
    root.add(halo);

    const ring = new THREE.LineLoop(
      new THREE.BufferGeometry().setFromPoints(
        Array.from({ length: 96 }, (_, k) => {
          const a = k / 96 * Math.PI * 2;
          return new THREE.Vector3(Math.cos(a) * 1.92, 0, Math.sin(a) * 1.92);
        })
      ),
      new THREE.LineBasicMaterial({ color: 0xE7E9E8, transparent: true, opacity: 0.14 })
    );
    ring.rotation.x = 0.42; root.add(ring);

    const size = () => {
      const w = Math.max(1, Math.round(wrap.getBoundingClientRect().width));
      renderer.setSize(w, w, false);
      cam.aspect = 1; cam.updateProjectionMatrix();
    };
    size();
    if (window.ResizeObserver) { this.ro = new ResizeObserver(size); this.ro.observe(wrap); }

    let tx = 0, ty = 0, cx = 0, cy = 0, drag = false, lx = 0, ly = 0, vx = 0, vy = 0;
    const onMove = e => {
      const r = wrap.getBoundingClientRect();
      if (drag) {
        vy = (e.clientX - lx) * 0.006; vx = (e.clientY - ly) * 0.006;
        tx += vx; ty += vy; lx = e.clientX; ly = e.clientY;
      } else {
        tx = -((e.clientY - (r.top + r.height / 2)) / r.height) * 0.5;
        ty = ((e.clientX - (r.left + r.width / 2)) / r.width) * 0.7;
      }
    };
    const down = e => { drag = true; lx = e.clientX; ly = e.clientY; cv.style.cursor = 'grabbing'; };
    const up = () => { drag = false; cv.style.cursor = 'grab'; };
    window.addEventListener('pointermove', onMove, { passive: true });
    cv.addEventListener('pointerdown', down);
    window.addEventListener('pointerup', up);
    this._cleanup = () => {
      window.removeEventListener('pointermove', onMove);
      cv.removeEventListener('pointerdown', down);
      window.removeEventListener('pointerup', up);
    };

    let t = 0;
    const loop = () => {
      t += 1;
      cx += (tx - cx) * 0.06; cy += (ty - cy) * 0.06;
      root.rotation.x = cx; root.rotation.y = cy;
      shells.forEach(m => {
        m.rotation.x += m.userData.sp[0];
        m.rotation.y += m.userData.sp[1];
        m.rotation.z += m.userData.sp[2];
      });
      this._writeShards(t);
      pts.rotation.y -= 0.0009;
      ring.rotation.z += 0.0014;
      const b = 1 + Math.sin(t / 74) * 0.09;
      nucleus.scale.setScalar(b);
      halo.scale.setScalar(1 + Math.sin(t / 74 + 1) * 0.16);
      cam.position.x = Math.sin(t / 900) * 0.16;
      renderer.render(scene, cam);
      this.raf = requestAnimationFrame(loop);
    };
    loop();
  }
  renderVals(){ return { canvasRef: this.canvasRef, wrapRef: this.wrapRef }; }
}
</script>
</body>
</html>
